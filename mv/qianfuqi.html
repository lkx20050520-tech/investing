<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>潜伏期 · MV</title>
<style>
:root{--bg:#0b0d18;--fg:#e8ecf8;--dim:#8d93b0;--vio:#b44cff;--org:#e07a4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
#stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#cap{position:absolute;left:0;right:0;bottom:5%;text-align:center;font-size:clamp(16px,3.4vw,30px);letter-spacing:.08em;text-shadow:0 0 8px #000,0 2px 2px #000;padding:0 4%;transition:opacity .3s}
#title{position:absolute;inset:0 0 40% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;transition:opacity 1.5s;color:#232a58;text-shadow:0 0 22px #fff,0 0 8px #fff}
#title b{font-size:clamp(34px,9vw,84px);letter-spacing:.3em;font-weight:600}
#title span{font-size:clamp(13px,2.4vw,22px);color:#3a3f78;margin-top:.6em;letter-spacing:.2em}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
button,label.btn{background:#1b1f38;color:var(--fg);border:1px solid #343a63;border-radius:6px;padding:8px 12px;font-size:14px;cursor:pointer}
button:hover,label.btn:hover{border-color:var(--vio)}
input[type=range]{flex:1;min-width:160px;accent-color:var(--vio)}
#tm{font-variant-numeric:tabular-nums;color:var(--dim);min-width:92px}
.hint{color:var(--dim);font-size:13px;line-height:1.7;margin:6px 0 14px}
h2{font-size:16px;margin:22px 0 8px;font-weight:600}
#sb{border-top:1px solid #23284a}
.row{display:grid;grid-template-columns:48px 1fr;gap:2px 10px;padding:8px 6px;border-bottom:1px solid #1a1e38;cursor:pointer;border-left:3px solid transparent}
.row.on{background:#171a33;border-left-color:var(--vio)}
.row .t{color:var(--dim);font-size:12px;grid-row:span 2;font-variant-numeric:tabular-nums;padding-top:2px}
.row .l{font-size:15px}.row .n{font-size:13px;color:var(--dim)}
@media(max-width:600px){main{padding:12px}}
</style>
</head>
<body>
<main>
<div id="stage"><canvas id="c" width="320" height="180"></canvas><div id="cap"></div>
<div id="title"><b>潜伏期</b><span>孙盛希 Shi Shi</span></div></div>

<div class="ctl">
  <button id="play">▶ 播放</button>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <span id="tm">0:00 / 0:00</span>
</div>
<div class="ctl">
  <label class="btn">🎵 载入歌曲音频<input id="aud" type="file" accept="audio/*" hidden></label>
  <button id="c1" disabled>校准①：此刻唱到「毫无征兆」</button>
  <button id="c2" disabled>校准②：此刻「渐渐沦陷」唱完（第二遍副歌结尾）</button>
  <button id="fs">全屏</button>
</div>
<p class="hint">
  时间轴已按《潜伏期》真实音频的人声乐句对齐：载入同一版本的歌曲文件直接播放即可，无需校准。若你用的是别的版本（演唱会版、纯音乐版等），再用校准①②；校准后可用键盘 ← → 微调 0.5 秒，空格暂停。
</p>
<h2>分镜：每一句歌词 ↔ 对应画面（点击可跳转）</h2>
<div id="sb"></div>
</main>

<script>
const W=320,H=180,FL=125;
const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const ORG='#e07a4f',ORGD='#b0502e',VIO='#b44cff',VIOD='#5b1f8a',RED='#ff4d5e',WHT='#e8ecf8';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,ease=p=>{p=clamp(p);return p*p*(3-2*p)};
const hx=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t))).toString(16).padStart(2,'0')).join('')};
const hs=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
let T=0;
const R=(x,y,w,h,col)=>{if(col)g.fillStyle=col;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const A=a=>{g.globalAlpha=clamp(a)};

/* ---------- 小螃蟹 ---------- */
const K=2;
const cl=(x,y,lx,ly)=>[x+8+(lx-8)*K,y+13+(ly-13)*K];
function crab(x,y,o={}){
  const ks=o.k||K;g.save();g.translate(Math.round(x+8),Math.round(y+13));g.scale(ks,ks);x=-8;y=-13;
  const tint=o.tint||0,body=o.col||mix(ORG,VIO,tint),dk=o.dk||mix(ORGD,VIOD,tint);
  const sh=o.shiver?Math.round(Math.sin(T*45)*o.shiver):0;x+=sh;
  const dy=o.bob===false?0:Math.round(Math.sin(T*3)*.6);y+=dy;
  for(let i=0;i<4;i++)R(x+2+i*4,y+10,2,3,dk);
  const k=o.cover||0,ar=o.arms||'side';
  const ay=ar==='up'?y-3:ar==='down'?y+7:y+2;
  const lx=lerp(x-4,x+3,k),rx=lerp(x+16,x+9,k),cy=lerp(ay,y+4,k);
  R(lx,cy,4,3,body);R(lx-1,cy-1,2,2,body);R(rx,cy,4,3,body);R(rx+3,cy-1,2,2,body);
  R(x,y,16,10,body);R(x,y+8,16,2,dk);
  if(o.coat){R(x-1,y+4,18,7,'#3b6ea8');R(x-1,y+4,18,1,'#5b8ec8');R(x+7,y+4,2,7,'#2c5486');R(x+10,y+6,1,1,WHT);R(x+10,y+8,1,1,WHT)}
  const e=o.eyes||'open',ex=[x+4,x+10],ey=y+2;
  const eye=(X)=>{
    if(e==='open'){R(X,ey,2,3,'#14131f');R(X,ey,1,1,WHT)}
    else if(e==='half'){R(X,ey+1,2,2,'#14131f');R(X,ey,2,1,dk)}
    else if(e==='closed'){R(X-.5,ey+2,3,1,'#14131f')}
    else if(e==='happy'){R(X-.5,ey+2,1,1,'#14131f');R(X+.5,ey+1,1,1,'#14131f');R(X+1.5,ey+2,1,1,'#14131f')}
    else if(e==='heart'){R(X-1,ey,1,1,RED);R(X+1,ey,1,1,RED);R(X-1,ey+1,3,1,RED);R(X,ey+2,1,1,RED);R(X,ey+1,1,1,'#ff9aa5')}
    else if(e==='spiral'){R(X-.5,ey,3,3,VIO);R(X+.5,ey+1,1,1,'#14131f')}
  };
  ex.forEach(eye);
  if(o.mouth==='smile'){R(x+5,y+6,1,1,'#14131f');R(x+6,y+7,4,1,'#14131f');R(x+10,y+6,1,1,'#14131f')}
  if(o.mouth==='flat')R(x+6,y+7,4,1,'#14131f');
  g.restore();
}
function virus(x,y,r,a=1){
  A(.22*a);R(x-r-2,y-r-2,2*r+5,2*r+5,VIO);A(.4*a);R(x-r-1,y-r-1,2*r+3,2*r+3,VIO);A(a);
  R(x-r,y-r,2*r+1,2*r+1,VIO);R(x-r+1,y-r+1,Math.max(1,r-1),Math.max(1,r-1),'#e0a8ff');
  R(x-1,y-r-2,2,2,VIO);R(x-1,y+r+1,2,2,VIO);R(x-r-2,y-1,2,2,VIO);R(x+r+1,y-1,2,2,VIO);
  R(x-r-1,y-r-1,1,1,VIO);R(x+r+1,y-r-1,1,1,VIO);R(x-r-1,y+r+1,1,1,VIO);R(x+r+1,y+r+1,1,1,VIO);
  A(1);
}
function pain(x,y,a=1){A(a);R(x,y,1,3,RED);R(x+1,y+3,1,3,RED);R(x,y+6,1,3,RED);R(x-1,y+2,1,1,'#ffb3ba');A(1)}

/* ---------- 场景元素 ---------- */
function sky(x,y,w,h,q=1){
  R(x,y,w,h,'#0a0e24');
  const n=Math.ceil(w*h/120);
  for(let i=0;i<n;i++)if(Math.sin(T*2+i*3.1)>-.4*q)R(x+hs(i)*(w-1),y+hs(i+50)*(h-1),1,1,i%5?'#cfd6ff':'#fff7c0');
  const mx=x+w*.72,my=y+h*.3;R(mx-3,my-4,6,8,'#f4f0d2');R(mx-4,my-3,8,6,'#f4f0d2');R(mx-1,my-3,5,6,'#0a0e24');
}
function win(x,y,w,h,q){R(x-2,y-2,w+4,h+4,'#4a4468');sky(x,y,w,h,q);R(x+w/2-1,y,2,h,'#4a4468');R(x,y+h/2-1,w,2,'#4a4468');R(x-4,y+h+2,w+8,3,'#5a5480')}
const mood=()=>clamp((T-9)/165,0,.88); // 感染越深，房间越暗越紫
const wallC=(side=0)=>mix(side?'#c9cddc':'#e6e8f0','#2a2548',mood());
const floorC=()=>mix('#2f58b8','#1e1a40',mood());
function room(o={}){
  const m=mood(),cx=196;
  R(0,0,cx,FL,wallC(0));R(cx,0,W-cx,FL,wallC(1));            // 墙角：左亮右暗
  R(cx,0,1,FL,mix('#a9aec4','#17142e',m));
  R(0,FL-3,W,3,mix('#f2f3f8','#3a3560',m));                    // 踢脚线
  R(0,FL,W,H-FL,floorC());
  for(let x=0;x<W;x+=6)for(let y=FL+2;y<H;y+=6)if(hs(x*7+y)>.55)R(x,y,2,1,mix('#3d69cc','#2a2458',m)); // 地毯纹理
  if(o.win!==false)win(232,26,54,50);
  A(.9);R(cx+8,FL+4,26,7,'#d6384a');R(cx+10,FL+2,22,3,'#e8566a');A(1);  // 封面里的红色：墙角的红垫子
  if(o.lamp){A(.1);R(40,30,60,95,'#fff3c0');A(1)}
}
function vig(a){ // 暗角
  for(let i=0;i<6;i++){A(a/6);R(0,0,W,i*4,'#000');R(0,H-i*4,W,i*4,'#000');R(0,0,i*6,H,'#000');R(W-i*6,0,i*6,H,'#000')}A(1);
}
function water(level,a=.55,t=1){ // level: 水面y
  A(a);R(0,level,W,H-level,'#1a2e6a');A(a*.6);R(0,level,W,H-level,VIOD);A(1);
  for(let x=0;x<W;x+=2){const yy=level+Math.sin(x*.12+T*2.2)*1.5;R(x,yy,2,1,'#7a8cff')}
}
function bubbles(cx,cy,n,spread=12){for(let i=0;i<n;i++){const q=(T*.5+hs(i))%1;const x=cx+Math.sin(i*5+T)*spread,y=cy-q*60;A(1-q);R(x,y,2,2,'#9fb4ff');R(x+.5,y+.5,1,1,'#fff');}A(1)}
function silhouette(cx,cy,s,col,jag){ // 缩放的螃蟹剪影
  g.save();g.translate(cx,cy);g.scale(s,s);crab(-8,-5,{col,dk:col,bob:false,k:1});g.restore();
}

/* ---------- 20 个场景 ---------- */
const S={};
const CX=152,CY=112;

S.intro=p=>{room({lamp:true});crab(CX,CY,{});const t=cl(CX,CY,12,4);A(.15+.25*Math.sin(T*3)**2);R(t[0],t[1],2,2,VIO);A(1)};

S.speck=p=>{room({lamp:true});crab(CX,CY);const e=ease(p);
  const tg=cl(CX,CY,12,4),x=lerp(258,tg[0],e),y=lerp(52,tg[1],e)+Math.sin(p*20)*2;
  A(1-e*.9);R(x,y,1,1,VIO);R(x-1,y,1,1,'#7a3aa8');A(1);
  A(.2+.3*(Math.sin(T*4)>0));if(e>.95)R(tg[0],tg[1],2,2,VIO);A(1)};

S.nobody=p=>{room({lamp:true});crab(CX,CY);
  const cols=['#5a7fc0','#7ab08a','#c0a05a'];
  for(let i=0;i<3;i++){
    const q=p*1.3-i*.28;if(q<0||q>1)continue;
    let x=lerp(-14,W+4,q);const stop=Math.abs(x-(CX+8))<22&&q>.3;
    const wy=112+i%2*3,leg=Math.floor(T*6+i)%2;
    R(x,wy,6,7,cols[i]);R(x+1,wy-4,4,4,'#f0d0b0');R(x+1,wy-4,4,1,'#3a3040');
    R(x+(leg?0:3),wy+7,2,3,'#2a2a40');R(x+(leg?3:0),wy+7,2,3,'#2a2a40');
    if(Math.abs(x-(CX+8))<26){R(x+2,wy-8,1,2,WHT);R(x+2,wy-5.5,1,1,WHT);}
  }};

S.coat=p=>{room({wall:'#162036',floor:'#222a42',lamp:false,win:true});crab(CX,CY,{coat:true,shiver:1,tint:.1,arms:'down',eyes:'half'});
  for(let i=0;i<6;i++){const a=T*20+i*2;R(CX-14+Math.sin(a)*3+i*8,CY-12+((T*8+i*7)%18),1,2,'#8fb4ff')}
  for(let i=0;i<4;i++){const q=(T*.6+i*.25)%1;A(1-q);R(CX+10+i*3-q*4,CY-12-q*18,2,2,'#dce8ff');}A(1)};

S.bed=p=>{room({lamp:true});
  R(70,104,150,6,'#6b4a36');R(70,110,150,16,'#5a3d2c');R(70,126,4,6,'#3a281c');R(216,126,4,6,'#3a281c');
  R(72,100,18,6,'#dfe3f0'); // 枕头
  const e=ease((p-.35)/.4);
  crab(130,95,{eyes:p<.35?'open':'closed',mouth:(p<.25&&p>.1)?'flat':null,tint:.15,bob:false});
  R(100,108,120,3,'#e8ecf8');
  const top=lerp(114,91,e);R(96,top,126,110-top+2,'#4a5fa0');R(96,top,126,2,'#6a80c4');
  for(let i=0;i<5;i++)R(104+i*22,top+3,1,110-top-2,'#3f5390');
  if(e>.9){R(131,86,4,5,'#14131f');R(141,86,4,5,'#14131f');R(131,86,2,2,WHT);R(141,86,2,2,WHT)}
  if(p>.7){A((p-.7)*3);R(162,78,3,1,WHT);R(167,72,4,1,WHT);R(173,65,5,1,WHT);A(1)}};

S.sting=p=>{room({wall:'#1c1830',lamp:false});crab(CX,CY,{tint:.28,arms:'down',eyes:'half'});
  const n=Math.floor(T*7);for(let i=0;i<4;i++){const k=n*7+i;const a=hs(k)*Math.PI*2,r=20+hs(k+9)*10;
    pain(CX+8+Math.cos(a)*r*1.4,CY-6+Math.sin(a)*r*.8-3,hs(k+3)>.2?1:.4)}
  for(let i=0;i<6;i++){const q=(T*.8+i/6)%1;A(.5*(1-q));R(CX-16+hs(i)*50,CY-12-q*26,1,1,'#ff9aa5')}A(1)};

S.outline=p=>{room({wall:'#171a30',lamp:false});
  const f=1-ease((p-.45)/.5)*.85;
  crab(88,CY,{arms:p<.5?'up':'down',eyes:p<.6?'open':'closed',tint:.1,bob:false});
  // 「你」的轮廓：虚线、柔光、模糊
  const px=210,py=84;A(.12*f);R(px-16,py-14,32,54,'#ffd0e0');A(.2*f);R(px-12,py-10,24,46,'#ffd0e0');A(f);
  const dots=[];for(let a=0;a<28;a++){const t=a/28*Math.PI*2;dots.push([px+Math.cos(t)*7,py+Math.sin(t)*7])}
  dots.forEach((d,i)=>{if((i+Math.floor(T*3))%2===0)R(d[0],d[1],1,1,'#f3c4d8')});
  for(let y=py+9;y<py+38;y+=2){const w=y<py+14?10:16;if(((y>>1)+Math.floor(T*3))%2===0){R(px-w/2,y,1,1,'#f3c4d8');R(px+w/2,y,1,1,'#f3c4d8')}}
  A(1);
  if(p<.5){}};

S.words=(p,hard)=>{room({wall:'#171528',lamp:false,win:false});
  const hh=cl(CX,CY,8,-2),hx0=hh[0],hy0=hh[1];let orb=hard?6:0;
  for(let i=0;i<8;i++){
    const q=(p*10-i)/1.6;if(q<0)continue;
    if(q>=1){orb++;continue}
    const e=ease(q),sy=36+(i%4)*20,x=lerp(310,hx0,e),y=lerp(sy,hy0,e);
    const w=11;A(1);R(x-w/2,y-4,w,7,WHT);R(x-w/2+2,y+3,2,2,WHT);
    if(Math.floor(T*4+i)%2)R(x-3,y-1,1,1,'#555');R(x-1,y-1,1,1,'#555');R(x+1,y-1,1,1,'#555');
    if(q>.8){A((q-.8)*5);virus(x,y,2,1)}A(1);
  }
  crab(CX,CY,{eyes:p>.6?'spiral':'open',tint:hard?.45:Math.min(.4,p*.4)});
  for(let i=0;i<Math.min(orb,10);i++){const a=T*2+i*(Math.PI*2/Math.min(orb,10)||1);virus(hx0+Math.cos(a)*24,hy0+Math.sin(a)*8-6,1,.9)}};

S.antibody=(p,hard)=>{R(0,0,W,H,'#06101e');
  for(let i=0;i<W;i+=8)R(i,0,1,H,'#0a1a2e');for(let j=0;j<H;j+=8)R(0,j,W,1,'#0a1a2e');
  A(.35);g.save();g.translate(160,90);g.scale(4,4);crab(-8,-5,{col:'#2a7fb0',dk:'#1d5a80',bob:false,eyes:'closed',k:1});g.restore();A(1);
  const N=7,alive=N-Math.floor(p*(N+.9));
  for(let i=0;i<N;i++){
    const a=T*1.1+i*Math.PI*2/N,x=160+Math.cos(a)*34,y=92+Math.sin(a)*16;
    if(i<alive){
      R(x,y,1,4,WHT);R(x-1,y-1,1,1,WHT);R(x-2,y-2,1,1,WHT);R(x+1,y-1,1,1,WHT);R(x+2,y-2,1,1,WHT);
      if(i>=alive-2||hard){virus(x+5,y+1,1,.9)}
    }else if(i===alive){ // 正在被击溃
      const f=Math.floor(T*12)%2;R(x-2,y-2,5,5,f?RED:'#ffb3ba');virus(x+3,y,2,1);
    }
  }
  const pul=2+Math.sin(T*3)*.6;virus(160,96,3,1);A(.25);R(160-14,96-14,28,28,VIO);A(1);
  A(.5);R(160-pul-6,96,2*pul+12,1,VIO);A(1)};

S.days=(p,hard)=>{
  R(0,0,W,H,wallC());R(0,FL-3,W,3,mix('#f2f3f8','#3a3560',mood()));R(0,FL,W,H-FL,floorC());
  const d=Math.floor(p*7.99);
  for(let i=0;i<8;i++){const x=40+i*30;R(x,16,24,22,WHT);R(x,16,24,5,i<=d?RED:'#c04050');
    if(i<d){R(x+4,26,16,2,'#7a3040');R(x+4,30,10,2,'#7a3040')}
    if(i===d){A(.5+.5*Math.sin(T*10));R(x-1,15,26,24,VIO);A(1);R(x,16,24,22,WHT);R(x,16,24,5,RED)}}
  crab(CX,CY,{tint:lerp(hard?.4:.05,hard?.7:.45,ease(p)),mouth:'flat',eyes:'open'});
  const n=Math.floor(p*26)+(hard?14:0);
  for(let i=0;i<n;i++){const q=cl(CX,CY,1+hs(i)*14,1+hs(i+33)*8);A(.85);R(q[0],q[1],2+(i%3===0)*2,2,VIO);}A(1);
  A(.3);R(CX-20,CY+14,60,2,'#000');A(1)};

S.sink=(p,hard)=>{
  R(0,0,W,H,wallC());R(0,FL-3,W,3,mix('#f2f3f8','#3a3560',mood()));
  const sk=Math.floor(p*6)*2.2;
  const fy=FL+(hard?0:0);
  R(0,fy,W,H-fy,mix(floorC(),VIO,.35+p*.3));
  crab(CX,CY+sk,{tint:hard?.7+p*.2:.45+p*.25,eyes:p>.5?'half':'open',mouth:'flat',arms:'down',bob:false});
  // 沼泽盖住下半身

const $=id=>document.getElementById(id);
const aud=new Audio();let hasAud=false,playing=false,t0=0,tl0=0;
const cal={a1:null,a2:null,off:0};
const tlOf=a=>{if(cal.a1!=null&&cal.a2!=null)return 10+(a-cal.a1)*(190/(cal.a2-cal.a1))+cal.off;return a+(cal.a1!=null?10-cal.a1:0)+cal.off};
const audOf=t=>{if(cal.a1!=null&&cal.a2!=null)return cal.a1+(t-cal.off-10)*((cal.a2-cal.a1)/190);return t-cal.off-(cal.a1!=null?10-cal.a1:0)};
let TL=0;
const total=()=>END;
function now(){if(hasAud)return tlOf(aud.currentTime);return playing?tl0+(performance.now()-t0)/1000:TL}
function setTL(t){t=clamp(t,0,total());if(hasAud){aud.currentTime=Math.max(0,audOf(t))}tl0=t;t0=performance.now();TL=t}
function play(){playing=true;$('play').textContent='❚❚ 暂停';if(hasAud)aud.play();else{tl0=TL;t0=performance.now()}}
function pause(){playing=false;$('play').textContent='▶ 播放';if(hasAud)aud.pause();else TL=now()}
$('play').onclick=()=>playing?pause():(TL>=total()-.1&&setTL(0),play());
$('aud').onchange=e=>{const f=e.target.files[0];if(!f)return;pause();aud.src=URL.createObjectURL(f);hasAud=true;cal.a1=cal.a2=null;cal.off=0;$('c1').disabled=$('c2').disabled=false;aud.onloadedmetadata=()=>{TL=0};aud.currentTime=0;$('tm').textContent='已载入音频'};
$('c1').onclick=()=>{cal.a1=aud.currentTime;cal.a2=null;$('c1').textContent='校准① ✓'};
$('c2').onclick=()=>{if(cal.a1==null||aud.currentTime<=cal.a1+30)return alert('请先点校准①，再在歌曲后段点校准②');cal.a2=aud.currentTime;$('c2').textContent='校准② ✓'};
$('fs').onclick=()=>$('stage').requestFullscreen&&$('stage').requestFullscreen();
$('seek').oninput=e=>setTL(e.target.value/1000*total());
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('play').click()}
  if(e.code==='ArrowLeft'){cal.off-=.5}if(e.code==='ArrowRight'){cal.off+=.5}});
const fmt=s=>{s=Math.max(0,s|0);return(s/60|0)+':'+String(s%60).padStart(2,'0')};

const sb=$('sb');
L.forEach((l,i)=>{const d=document.createElement('div');d.className='row';d.innerHTML=`<div class="t">${fmt(l.t)}</div><div class="l">${l.text}</div><div class="n">🎞 ${l.note}</div>`;d.onclick=()=>{setTL(l.t+.01);if(!playing)play()};sb.appendChild(d);l.el=d});

let curI=-1;
function frame(){
  let t=now();
  if(playing&&!hasAud&&t>=total()){pause();TL=total();t=total()}
  if(hasAud&&aud.ended&&playing)pause();
  T=t;
  let i=0;for(let k=0;k<L.length;k++)if(t>=L[k].t)i=k;
  const intro=t<L[0].t,l=L[i];
  const p=intro?clamp(t/L[0].t):clamp((t-l.t)/(l.end-l.t));
  g.globalAlpha=1;
  const sc=intro?'intro':l.sc;
  const fn=SC[sc]||S[sc];fn(p);
  const fin=Math.min(p,1-(intro?0:0));
  if(!intro&&p<.06){A(1-p/.06);R(0,0,W,H,'#000');A(1)}
  if(!intro&&p>.95&&i<L.length-1){A((p-.95)/.05);R(0,0,W,H,'#000');A(1)}
  if(t>L[L.length-1].t+8){A(clamp((t-L[L.length-1].t-8)/6));R(0,0,W,H,'#000');A(1)}
  if(!intro&&t>=L[0].t)$('title').style.opacity=0;else $('title').style.opacity=t>6.5?clamp(1-(t-6.5)/2.2):1;
  $('cap').textContent=intro||l.text==='—'?'':l.text;
  if(i!==curI&&!intro){if(curI>=0)L[curI].el.classList.remove('on');l.el.classList.add('on');curI=i;if(playing)l.el.scrollIntoView({block:'nearest'})}
  $('seek').value=t/total()*1000;
  $('tm').textContent=fmt(t)+' / '+fmt(total());
  requestAnimationFrame(frame);
}

/* ---------- 导出用：逐帧渲染成 1280x720 画面（含字幕） ---------- */
const exc=document.createElement('canvas');exc.width=1280;exc.height=720;const eg=exc.getContext('2d');
window.__render=t=>{
  T=t;let i=0;for(let k=0;k<L.length;k++)if(t>=L[k].t)i=k;
  const intro=t<L[0].t,l=L[i];
  const p=intro?clamp(t/L[0].t):clamp((t-l.t)/(l.end-l.t));
  g.globalAlpha=1;const sc=intro?'intro':l.sc;(SC[sc]||S[sc])(p);
  if(!intro&&p<.06){A(1-p/.06);R(0,0,W,H,'#000');A(1)}
  if(!intro&&p>.95&&i<L.length-1){A((p-.95)/.05);R(0,0,W,H,'#000');A(1)}
  const te=L[L.length-1].t+8;if(t>te){A(clamp((t-te)/6));R(0,0,W,H,'#000');A(1)}
  eg.imageSmoothingEnabled=false;eg.drawImage(c,0,0,1280,720);
  eg.textAlign='center';eg.textBaseline='middle';
  const ta=t>=L[0].t?0:(t>6.5?clamp(1-(t-6.5)/2.2):1);
  if(ta>0){eg.globalAlpha=ta;eg.shadowColor='#fff';eg.shadowBlur=24;eg.fillStyle='#232a58';eg.font='600 110px "Noto Sans CJK SC","PingFang SC",sans-serif';eg.fillText('潜 伏 期',640,200);
    eg.shadowBlur=8;eg.fillStyle='#3a3f78';eg.font='28px "Noto Sans CJK SC","PingFang SC",sans-serif';eg.fillText('孙盛希  Shi Shi',640,290);eg.globalAlpha=1;eg.shadowBlur=0}
  if(!intro&&l.text!=='—'){eg.shadowColor='#000';eg.shadowBlur=10;eg.shadowOffsetY=2;eg.fillStyle='#fff';eg.font='34px "Noto Sans CJK SC","PingFang SC",sans-serif';eg.fillText(l.text,640,670);eg.shadowBlur=0;eg.shadowOffsetY=0}
  return exc.toDataURL('image/jpeg',.93);
};
$('title').style.opacity=1;frame();
window.__setT=t=>{playing=false;TL=t;hasAud=false};
</script>
