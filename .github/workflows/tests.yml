# 逻辑验证的自动安全网
#
# 只跑 `tests.test_logic` —— 它用合成数据，不需要网络。
# 回测类命令 (`core.backtest`、`run_daily.py`) 依赖 yfinance 拉真实行情，
# GitHub 的 runner 上跑不稳定也没意义，所以刻意不放进 CI。
#
# 这一层守的是 CLAUDE.md 约束 #1：改了 core/ 下的代码，断言必须全过。

name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 逻辑验证 (合成数据，无网络)
        run: python -m tests.test_logic
